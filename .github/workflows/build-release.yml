name: Build & Release MailCentPro

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ex: v2.1)"
        required: true
        default: "v2.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            zip_name: MailCentPro-Windows.zip
          - os: macos-latest
            platform: Mac
            zip_name: MailCentPro-Mac.zip
          - os: ubuntu-latest
            platform: Linux
            zip_name: MailCentPro-Linux.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Dépendances système Linux ──────────────────────────────────────────
      - name: Dépendances système (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libxcb-cursor0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 zip

      # ── PySide6 + PyInstaller ──────────────────────────────────────────────
      - name: Installer PySide6 + PyInstaller
        run: pip install PySide6 pyinstaller

      # ── Build via spec commun ──────────────────────────────────────────────
      - name: Compiler avec mailcentpro.spec
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller mailcentpro.spec --clean --noconfirm

      # ── Dossier data ───────────────────────────────────────────────────────
      - name: Copier data (Windows / Linux)
        if: matrix.platform != 'Mac'
        shell: bash
        run: |
          mkdir -p dist/MailCentPro/data
          cp data/eleves_exemple.csv dist/MailCentPro/data/ 2>/dev/null || true

      - name: Copier data (Mac)
        if: matrix.platform == 'Mac'
        run: |
          mkdir -p "dist/MailCentPro.app/Contents/Resources/data"
          cp data/eleves_exemple.csv \
            "dist/MailCentPro.app/Contents/Resources/data/" 2>/dev/null || true

      # ── Créer les zips ─────────────────────────────────────────────────────
      - name: Créer le zip (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MailCentPro `
            -DestinationPath MailCentPro-Windows.zip -Force

      - name: Créer le zip (Mac)
        if: matrix.platform == 'Mac'
        run: |
          cd dist
          zip -r ../MailCentPro-Mac.zip MailCentPro.app/

      - name: Créer le zip (Linux)
        if: matrix.platform == 'Linux'
        run: |
          cd dist
          zip -r ../MailCentPro-Linux.zip MailCentPro/

      # ── Upload dans la Release ─────────────────────────────────────────────
      - name: Upload dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "MailCentPro ${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## MailCent Pro ${{ github.event.inputs.tag }}

            Interface **PySide6** — thème dark et clair commutables à la volée.

            ### Nouveautés ${{ github.event.inputs.tag }}
            - ⏸ Pause automatique tous les N envois (configurable : durée + fréquence)
            - Gestion abonnement en ligne (résiliation depuis mailcentpro.web.app)
            - Correction nom expéditeur emails de licence

            ### Télécharger
            | Système | Fichier |
            |---|---|
            | 🪟 Windows 10+ | `MailCentPro-Windows.zip` |
            | 🍎 macOS 12+ | `MailCentPro-Mac.zip` |
            | 🐧 Ubuntu / Debian | `MailCentPro-Linux.zip` |

            ### Lancer (aucune installation requise)
            1. Télécharger le zip correspondant à votre système
            2. Extraire l'archive
            3. **Windows** : double-cliquer `MailCentPro\MailCentPro.exe`
            4. **Mac** : double-cliquer `MailCentPro.app`
            5. **Linux** : lancer `./MailCentPro/MailCentPro` depuis un terminal
          files: ${{ matrix.zip_name }}
